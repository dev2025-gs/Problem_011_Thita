<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Container With Most Water – Visualizer</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        padding: 20px;
      }

      h1 {
        margin-bottom: 5px;
      }

      input {
        width: 400px;
        padding: 8px;
        font-size: 16px;
      }

      button {
        padding: 8px 14px;
        font-size: 16px;
        cursor: pointer;
        margin-left: 8px;
      }

      #chart {
        display: flex;
        align-items: flex-end;
        height: 300px;
        margin-top: 30px;
        border-left: 2px solid #333;
        border-bottom: 2px solid #333;
        padding: 10px;
        gap: 6px;
      }

      .bar {
        width: 30px;
        background: steelblue;
        position: relative;
      }

      .bar.left {
        background: orange;
      }

      .bar.right {
        background: crimson;
      }

      .bar span {
        position: absolute;
        bottom: -20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 12px;
      }

      #water {
        position: absolute;
        background: rgba(0, 150, 255, 0.3);
        pointer-events: none;
      }

      #info {
        margin-top: 20px;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Is Subsequence – Animation</h1>
    <p>Enter s and t strings:</p>
    <input id="inputS" value="axc" placeholder="s (subsequence)" />
    <input id="inputT" value="ahbgdc" placeholder="t (main string)" />
    <button onclick="start()">Start Animation</button>
    <button onclick="step()">Step</button>

    <div id="chartWrapper" style="position: relative; margin-top: 30px;">
      <div id="chartS" style="margin-bottom: 30px;"></div>
      <div id="chartT"></div>
    </div>

    <div id="info"></div>

    <script>
      let sArr, tArr, i, j, matched, running = false;

      function start() {
        running = false;
        sArr = document.getElementById("inputS").value.split("");
        tArr = document.getElementById("inputT").value.split("");
        i = 0;
        j = 0;
        matched = [];
        document.getElementById("info").innerHTML = "";
        draw();
        running = true;
      }

      function step() {
        if (!running) return;
        if (i >= sArr.length || j >= tArr.length) {
          let result = (i === sArr.length) ? "<strong>✅ s is a subsequence of t!</strong>" : "<strong>❌ s is NOT a subsequence of t.</strong>";
          document.getElementById("info").innerHTML += `<br>${result}`;
          running = false;
          return;
        }

        if (sArr[i] === tArr[j]) {
          matched.push(j);
          i++;
        }
        j++;
        draw();
      }

      function draw() {
        // Draw s
        const chartS = document.getElementById("chartS");
        chartS.innerHTML = "<b>s:</b> ";
        sArr.forEach((ch, idx) => {
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.display = "inline-block";
          span.style.width = "30px";
          span.style.height = "30px";
          span.style.textAlign = "center";
          span.style.lineHeight = "30px";
          span.style.margin = "0 4px";
          span.style.borderRadius = "6px";
          span.style.background = (idx < i) ? "#b2f2a5" : (idx === i ? "#ffe066" : "#eee");
          span.style.fontWeight = (idx === i) ? "bold" : "normal";
          chartS.appendChild(span);
        });

        // Draw t
        const chartT = document.getElementById("chartT");
        chartT.innerHTML = "<b>t:</b> ";
        tArr.forEach((ch, idx) => {
          const span = document.createElement("span");
          span.textContent = ch;
          span.style.display = "inline-block";
          span.style.width = "30px";
          span.style.height = "30px";
          span.style.textAlign = "center";
          span.style.lineHeight = "30px";
          span.style.margin = "0 4px";
          span.style.borderRadius = "6px";
          if (matched.includes(idx)) {
            span.style.background = "#b2f2a5";
          } else if (idx === j) {
            span.style.background = "#ffe066";
            span.style.fontWeight = "bold";
          } else {
            span.style.background = "#eee";
          }
          chartT.appendChild(span);
        });

        document.getElementById("info").innerHTML = `
          i (s) = ${i}, j (t) = ${j}<br>
          Matched indices in t: [${matched.join(", ")}]
        `;
      }
    </script>
  </body>
</html>
